name: Windows
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure WOW64 fixture
        run: cmake -S tests/targets -B out/build/research-x86 -G "Visual Studio 17 2022" -A Win32
      - name: Configure
        run: cmake --preset windows-x64
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Check install package
        run: |
          cmake --install out/build/windows-x64 --config ${{ matrix.preset == 'debug' && 'Debug' || 'Release' }} --prefix out/package
          if ($LASTEXITCODE -ne 0) { throw 'Package installation failed' }
          & ./out/package/bin/glAIpnir.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed executable failed' }
          & ./out/package/bin/glAIpnir-worker.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed worker failed' }
