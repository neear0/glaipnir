# Claude Code working on the current project.
#
# STATUS: needs network.mode = "proxy", which is not implemented yet (see README roadmap).
# `glaipnir policy check` validates this file today; `glaipnir run` refuses it until the proxy
# exists, rather than silently granting open internet. Credentials (ANTHROPIC_API_KEY or the
# ~/.claude login) are deliberately absent: the proxy will inject them per request, so they
# never exist inside the sandbox.

[sandbox]
name = "claude-code"

[filesystem]
read = []
write = ["${cwd}"]

[network]
mode = "proxy"
allow = [
  "api.anthropic.com",
  "statsig.anthropic.com",
  "sentry.io",
  "registry.npmjs.org",
  "github.com",
  "*.githubusercontent.com",
]

[env]
pass = ["PATH", "LANG", "TERM"]

[env.set]
DISABLE_AUTOUPDATER = "1"

[limits]
memory_mb = 8192
max_processes = 256
wall_timeout_s = 0

[capabilities]
child_processes = true
